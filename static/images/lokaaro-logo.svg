<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="lk-title">
  <title id="lk-title">Lokaaro mark</title>
  <defs>
    <linearGradient id="lk-mark-gradient" x1="12" y1="10" x2="84" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2EC4B6"/>
      <stop offset="1" stop-color="#0C7A6A"/>
    </linearGradient>
  </defs>
  <!-- House outline with eaves -->
  <path d="M48 9 L86 43 H74 V83 H22 V43 H10 Z" fill="none" stroke="url(#lk-mark-gradient)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Compass circle -->
  <circle cx="48" cy="61" r="14" fill="none" stroke="url(#lk-mark-gradient)" stroke-width="5"/>
  <!-- 4-point compass rose -->
  <!-- North point (filled) -->
  <path d="M48 47 L51 58 L48 56 L45 58 Z" fill="url(#lk-mark-gradient)"/>
  <!-- South point -->
  <path d="M48 75 L51 64 L48 66 L45 64 Z" fill="url(#lk-mark-gradient)"/>
  <!-- East point -->
  <path d="M62 61 L51 58 L53 61 L51 64 Z" fill="url(#lk-mark-gradient)"/>
  <!-- West point -->
  <path d="M34 61 L45 58 L43 61 L45 64 Z" fill="url(#lk-mark-gradient)"/>
</svg>
