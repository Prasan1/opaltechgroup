<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="rs-title">
  <title id="rs-title">RankSewa mark</title>
  <defs>
    <linearGradient id="rs-mark-gradient" x1="12" y1="10" x2="84" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2EC4B6"/>
      <stop offset="1" stop-color="#0C7A6A"/>
    </linearGradient>
  </defs>
  <!-- Earpiece dots -->
  <circle cx="26" cy="14" r="5" fill="url(#rs-mark-gradient)"/>
  <circle cx="70" cy="14" r="5" fill="url(#rs-mark-gradient)"/>
  <!-- Left tube curving down to junction -->
  <path d="M26 19 C26 38 44 40 48 40" fill="none" stroke="url(#rs-mark-gradient)" stroke-width="6" stroke-linecap="round"/>
  <!-- Right tube curving down to junction -->
  <path d="M70 19 C70 38 52 40 48 40" fill="none" stroke="url(#rs-mark-gradient)" stroke-width="6" stroke-linecap="round"/>
  <!-- Stem -->
  <line x1="48" y1="40" x2="48" y2="56" stroke="url(#rs-mark-gradient)" stroke-width="6" stroke-linecap="round"/>
  <!-- Chest piece (diaphragm) -->
  <circle cx="48" cy="72" r="17" fill="none" stroke="url(#rs-mark-gradient)" stroke-width="6"/>
  <!-- Checkmark inside chest piece -->
  <path d="M38 72 L44.5 78.5 L58 64" fill="none" stroke="url(#rs-mark-gradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
